<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Heavy Day</title><style>
  :root { --bg: #ffffff; --text: #1b0b36; --muted: #5b4b7a; --accent: #7c3aed; --rule: #eadfff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0617; --text: #ffffff; --muted: #cbbfe6; --accent: #c4a1ff; --rule: #2a1a4a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 21px; margin: 36px 0 8px; padding-top: 24px; border-top: 1px solid var(--rule); }
  p, li { color: var(--muted); }
  .updated { margin-top: 0; font-size: 14px; }
  a { color: var(--accent); }
  nav { font-size: 15px; max-width: 720px; margin: 0 auto; padding: 48px 20px 0; }
  nav a { margin-right: 16px; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .skip { position: absolute; left: 16px; top: -48px; padding: 8px 12px; background: var(--accent); color: #fff; border-radius: 6px; }
